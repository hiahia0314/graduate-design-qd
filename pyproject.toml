[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myretest"
version = "0.1.0"
description = "A minimal daily cross-sectional A-share backtesting framework"
requires-python = ">=3.11"

[project.optional-dependencies]
market-data = ["akshare", "pandas", "pyarrow", "requests", "xlrd"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
